<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Dictado de ortografía en español: práctica y examen con reglas, escritura en pantalla y repaso de errores.">
<title>Dictado — Práctica de ortografía</title>

<!-- PWA: instalación como app en el celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C5CE7">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<!-- iOS: usa esto en vez del manifest para el ícono y el modo pantalla completa -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dictado">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grad-1: #6C5CE7;
    --grad-2: #FF6F91;
    --grad-3: #FFC371;
    --card-bg: #ffffff;
    --ink: #2b2620;
    --ink-dim: #7a746c;
    --ui-accent: #6C5CE7;
    --ui-accent-2: #FF2D95;
    --good: #22C55E;
    --bad: #FF3B30;
    --paper-line: rgba(43,38,32,0.08);
    --font-display: 'Kalam', 'Segoe Script', cursive;
    --font-body: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 55%, var(--grad-3) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 14px;
  }

  .app{ width:100%; max-width: 660px; }

  header.topbar{ text-align:center; margin-bottom: 14px; }
  header.topbar h1{
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 6.5vw, 2.9rem);
    margin: 0;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }
  header.topbar p{
    margin: 4px 0 0;
    color: rgba(255,255,255,0.9);
    font-size: 0.95rem;
  }

  .speed-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0 18px;
  }
  .speed-label{ color: rgba(255,255,255,0.9); font-size: 0.85rem; font-weight:700; margin-right:2px; }
  .speed-btn{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.82rem;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.15);
    color: #fff;
    padding: 7px 13px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .speed-btn:hover{ background: rgba(255,255,255,0.28); }
  .speed-btn.active{ background:#fff; color: var(--ui-accent); border-color:#fff; }
  .speed-btn[aria-pressed="true"]{ background:#fff; color: var(--ui-accent); border-color:#fff; }

  .card{
    background: var(--card-bg);
    border-radius: 22px;
    padding: 28px 24px;
    box-shadow: 0 25px 55px rgba(0,0,0,0.28);
    border-top: 7px solid;
    border-image: linear-gradient(90deg,#06AED5,#FF3B30,#E8A600,#9D4EDD,#2ECC71,#FF2D95,#3A86FF,#FB8500) 1;
  }

  .hidden{ display:none !important; }

  /* ---------- MENU ---------- */
  .menu-options{ display:flex; flex-direction:column; gap: 14px; }
  .mode-btn{
    display:flex;
    align-items:center;
    gap: 14px;
    background: #F7F5FF;
    border: 2px solid rgba(108,92,231,0.2);
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--ink);
    text-align:left;
    cursor:pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
    font-family: var(--font-body);
  }
  .mode-btn:hover{ transform: translateY(-2px); border-color: var(--ui-accent); }
  .mode-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .mode-btn .emoji{ font-size: 2rem; }
  .mode-btn strong{ display:block; font-size: 1.08rem; }
  .mode-btn span.desc{ color: var(--ink-dim); font-size: 0.88rem; }

  .options-row{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px dashed rgba(43,38,32,0.12);
  }
  .opt-toggle{
    display:flex; align-items:center; gap:6px;
    font-size: 0.74rem; font-weight:700; color: var(--ink);
    background: #F7F5FF; border: 2px solid rgba(108,92,231,0.18);
    border-radius: 999px; padding: 5px 11px; cursor:pointer;
    font-family: var(--font-body);
  }
  .opt-toggle input{ width:13px; height:13px; accent-color: var(--ui-accent); }
  .opt-toggle[aria-pressed="true"]{ border-color: var(--ui-accent); background: rgba(108,92,231,0.1); }

  /* ---------- FILTRO DE CATEGORIAS ---------- */
  .filter-block{ margin-top: 22px; border-top: 1px dashed rgba(43,38,32,0.15); padding-top: 16px; }
  .filter-title{
    font-size: 0.82rem; font-weight:800; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; text-align:center;
  }
  .cat-chips{ display:flex; flex-wrap:wrap; gap: 7px; justify-content:center; }
  .cat-chip{
    font-family: var(--font-body); font-weight:700; font-size: 0.6rem;
    border-radius: 999px; padding: 3px 7px; cursor:pointer;
    border: 1.5px solid; background: #fff; transition: all 0.15s ease;
  }
  .cat-chip[aria-pressed="false"]{ opacity: 0.42; }
  .chip-actions{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .chip-actions button{ font-size: 0.74rem; padding: 5px 12px; background: transparent; color: var(--ink-dim); text-decoration: underline; border:none; cursor:pointer; }
  .filter-count{ text-align:center; font-size:0.78rem; color: var(--ink-dim); margin-top: 10px; }
  .filter-count.warn{ color: var(--bad); font-weight:700; }

  /* ---------- AVISO DE VOZ ---------- */
  .voice-warn{
    background: #FFF4E5; border:2px solid #E8A600; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 0.84rem; color: #6b4a00;
  }
  .voice-warn strong{ display:block; margin-bottom:2px; }

  .context-frase{
    margin-top: 10px; font-family: var(--font-body); font-size: 0.86rem;
    color: var(--ink-dim); font-style: italic;
  }

  /* ---------- BADGES ---------- */
  .badge{
    display:inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* ---------- PRACTICE / EXAM SHARED ---------- */
  .session-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 14px;
    font-size: 0.9rem;
    color: var(--ink-dim);
    gap: 8px; flex-wrap: wrap;
  }
  .session-stats{ font-size: 0.82rem; color: var(--ink-dim); }
  .session-stats .ok{ color: var(--good); font-weight:700; }
  .session-stats .ko{ color: var(--bad); font-weight:700; }

  .timerbar{
    height: 7px;
    background: rgba(43,38,32,0.08);
    border-radius: 999px;
    overflow:hidden;
    margin: 10px 0 4px;
  }
  .timerbar-fill{
    height:100%;
    width: 100%;
    background: linear-gradient(90deg, var(--ui-accent), var(--ui-accent-2));
    transition: width 0.1s linear;
  }
  .timerbar-fill.paused{ opacity: 0.55; }

  .status-line{
    text-align:center;
    min-height: 1.4em;
    font-size: 0.95rem;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }

  .stage{
    min-height: 210px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap: 10px;
    cursor: default;
  }
  .stage.clickable{ cursor:pointer; }

  .speaker-icon{ font-size: 2.6rem; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:0.55; transform:scale(1);} 50%{ opacity:1; transform:scale(1.08);} }

  .word-reveal{
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 8.5vw, 3rem);
    letter-spacing: 1px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.1);
    opacity:0;
    animation: chalkIn 0.5s ease forwards;
  }
  @keyframes chalkIn{ from{ opacity:0; filter: blur(4px); transform: translateY(6px);} to{ opacity:1; filter: blur(0); transform:translateY(0);} }

  .paper-note{
    position:relative;
    background-image: repeating-linear-gradient(transparent, transparent 27px, var(--paper-line) 28px);
    color: var(--ink);
    border-radius: 4px;
    padding: 22px 18px 16px;
    margin-top: 6px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    transform: rotate(-0.6deg);
    font-family: var(--font-display);
    font-size: 1.05rem;
    line-height: 1.55;
  }
  .paper-note::before{
    content:"";
    position:absolute;
    top:-12px; left: 50%;
    width: 90px; height: 26px;
    margin-left: -45px;
    background: var(--note-accent, #FFD97D);
    opacity:0.85;
    transform: rotate(-3deg);
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
  }

  .hint-text{ margin-top: 14px; font-size: 0.85rem; color: var(--ink-dim); font-family: var(--font-body); }

  /* Escritura en pantalla */
  .type-box{
    width: 100%; max-width: 360px; margin: 8px auto 0;
  }
  .type-box input{
    width: 100%;
    font-family: var(--font-display);
    font-size: 1.55rem;
    text-align: center;
    padding: 12px 14px;
    border: 2px solid rgba(108,92,231,0.35);
    border-radius: 12px;
    background: #FAFAFF;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .type-box input:focus{
    outline: none;
    border-color: var(--ui-accent);
    box-shadow: 0 0 0 3px rgba(108,92,231,0.2);
  }
  .type-box input.ok{ border-color: var(--good); background: #F0FDF4; }
  .type-box input.ko{ border-color: var(--bad); background: #FEF2F2; }
  .type-feedback{
    min-height: 1.3em; font-size: 0.88rem; font-weight:700; margin-top: 6px;
  }
  .type-feedback.ok{ color: var(--good); }
  .type-feedback.ko{ color: var(--bad); }

  .timer-actions{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top: 8px;
  }
  .timer-actions button{
    font-size: 0.78rem; padding: 6px 12px;
    background: #F7F5FF; border: 1.5px solid rgba(108,92,231,0.25);
    color: var(--ink); border-radius: 999px;
  }

  .controls-row{ display:flex; gap: 10px; justify-content:center; margin-top: 16px; flex-wrap: wrap; }

  button{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.92rem;
    border-radius: 12px;
    border: none;
    padding: 11px 18px;
    cursor:pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  button:hover{ filter: brightness(1.06); }
  button:active{ transform: scale(0.97); }
  button:focus-visible{ outline: 3px solid var(--ui-accent); outline-offset: 2px; }

  .btn-ghost{ background: #fff; border: 2px solid rgba(43,38,32,0.15); color: var(--ink); }
  .btn-ghost:hover{ border-color: var(--ui-accent); }
  .btn-primary{ background: var(--ui-accent); color: #fff; }
  .btn-good{ background: var(--good); color: #fff; padding: 14px 24px; font-size: 1rem; }
  .btn-bad{ background: var(--bad); color: #fff; padding: 14px 24px; font-size: 1rem; }

  /* ---------- RESULTS ---------- */
  .score-wrap{ text-align:center; }
  .score-num{ font-family: var(--font-display); font-size: 4rem; line-height:1; color: var(--ui-accent); }
  .score-den{ color: var(--ink-dim); font-size: 1.1rem; }
  .score-msg{ margin-top: 8px; font-size: 1.05rem; }
  .score-sub{ color: var(--ink-dim); font-size: 0.9rem; margin-top: 4px; }

  .review-list{ margin-top: 20px; max-height: 280px; overflow-y:auto; padding-right: 4px; }
  .review-item{
    background: rgba(255,59,48,0.06);
    border-left: 3px solid var(--bad);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    text-align: left;
  }
  .review-item strong{ font-family: var(--font-display); font-size: 1.1rem; }
  .review-item p{ margin: 4px 0 0; font-size: 0.85rem; color: var(--ink-dim); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  @media (max-width: 420px){
    .card{ padding: 20px 16px; }
    .controls-row button{ flex: 1 1 auto; }
  }

  /* ---------- STATS BAR (racha / monedas / mascota) ---------- */
  .hero-row{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    width:100%;
    margin-top: 6px;
  }
  .hero-row #stat-streak{ justify-self:start; }
  .hero-row #stat-coins{ justify-self:end; }
  .stat-pill{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px;
    font-family: var(--font-body); font-weight: 800;
    background: rgba(255,255,255,0.22); color:#fff;
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 18px; padding: 10px 16px; min-width: 58px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
  }
  .stat-icon{ font-size: 2.1rem; line-height:1; }
  .stat-value{ font-size: 1.1rem; line-height:1.1; }
  .pop{ animation: stat-pop 0.4s ease; }
  @keyframes stat-pop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.3); }
    100%{ transform: scale(1); }
  }

  /* ---------- MASCOTA PROTAGONISTA ---------- */
  .pet-hero{
    display:flex; flex-direction:column; align-items:center; gap:0;
    justify-self:center;
  }
  .pet-emoji-wrap{
    position:relative; display:inline-block;
    animation: pet-bounce 2.4s ease-in-out infinite;
  }
  .pet-accessory{
    position:absolute; left:50%; transform:translateX(-50%);
    font-size: 1.5rem; pointer-events:none; line-height:1;
  }
  .pet-accessory.pos-top{ top:-13px; }
  .pet-accessory.pos-mid{ top:36%; }
  .pet-accessory.pos-bottom{ bottom:-4px; }
  .pet-hero-emoji{
    font-size: 4.4rem; line-height:1;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.28));
    display:inline-block;
  }
  .pet-hero-name{
    font-family: var(--font-display);
    font-size: 1.05rem; color:#fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    margin-top: -4px;
  }
  @keyframes pet-bounce{
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%{ transform: translateY(-10px) rotate(3deg); }
  }

  /* ---------- MASCOTAS ---------- */
  .pets-block{ margin-top: 20px; border-top: 1px dashed rgba(43,38,32,0.15); padding-top: 16px; }
  .pet-chips{ display:flex; flex-wrap:wrap; gap: 8px; justify-content:center; }
  .pet-chip{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family: var(--font-body);
    background: #F7F5FF; border: 2px solid rgba(108,92,231,0.2);
    border-radius: 14px; padding: 10px 12px; min-width: 68px;
    cursor:pointer; transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .pet-chip:hover{ transform: translateY(-2px); }
  .pet-chip .pet-emoji{ font-size: 1.7rem; }
  .pet-chip .pet-name{ font-size: 0.72rem; font-weight:700; color: var(--ink); }
  .pet-chip .pet-price{ font-size: 0.7rem; font-weight:800; color: var(--ink-dim); }
  .pet-chip.locked{ opacity: 0.55; }
  .pet-chip.locked .pet-emoji{ filter: grayscale(0.6); }
  .pet-chip.equipped{ border-color: var(--good); background: rgba(34,197,94,0.1); }
  .pet-chip.equipped .pet-price{ color: var(--good); }
  .pet-chip.owned:not(.equipped) .pet-price{ color: var(--ui-accent); }

  /* ---------- LOGROS ---------- */
  .achievements-block{ margin-top: 20px; border-top: 1px dashed rgba(43,38,32,0.15); padding-top: 16px; }
  .ach-chips{ display:flex; flex-wrap:wrap; gap: 8px; justify-content:center; }
  .ach-chip{
    font-size: 1.4rem; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    border-radius: 50%; background:#F7F5FF; border:2px solid rgba(108,92,231,0.18);
    filter: grayscale(1); opacity: 0.4; transition: all 0.2s ease; cursor:default;
  }
  .ach-chip.unlocked{ filter:none; opacity:1; border-color:#FFC371; background: rgba(255,195,113,0.18); }

  /* ---------- COFRE DIARIO ---------- */
  .chest-wrap{ display:flex; justify-content:center; margin-bottom: 16px; }
  .chest-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background: linear-gradient(135deg,#FFC371,#FF6F91);
    border:none; border-radius:16px; padding:9px 20px; cursor:pointer;
    box-shadow: 0 8px 18px rgba(255,111,145,0.35);
    transition: transform 0.15s ease;
  }
  .chest-btn:hover:not(:disabled){ transform: translateY(-2px) scale(1.03); }
  .chest-btn:disabled{ opacity:0.5; cursor:not-allowed; box-shadow:none; background:#e6e2f5; }
  .chest-emoji{ font-size: 2rem; display:inline-block; animation: chest-wiggle 1.8s ease-in-out infinite; }
  .chest-btn:disabled .chest-emoji{ animation:none; }
  @keyframes chest-wiggle{
    0%,100%{ transform: rotate(0deg); }
    10%{ transform: rotate(-8deg); }
    20%{ transform: rotate(8deg); }
    30%{ transform: rotate(-4deg); }
    40%{ transform: rotate(0deg); }
  }
  .chest-label{ font-family: var(--font-body); font-weight:800; font-size:0.76rem; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.2); }

  /* ---------- MEJOR PUNTAJE ---------- */
  .best-score{ display:block; margin-top:4px; font-weight:800; color: var(--ui-accent); }

  /* ---------- TOAST DE LOGRO ---------- */
  .achievement-toast{
    position:fixed; top:-90px; left:50%; transform: translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:16px; padding:12px 18px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.28);
    border: 2px solid #FFC371;
    z-index: 10000;
    transition: top 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease;
    opacity:0;
    max-width: 90vw;
  }
  .achievement-toast.show{ top: 16px; opacity:1; }
  .ach-emoji{ font-size: 2rem; }
  .ach-text{ font-family: var(--font-body); font-size: 0.83rem; color: var(--ink); line-height:1.3; }
  .ach-text strong{ font-family: var(--font-display); color: var(--ui-accent); font-size:0.95rem; }

  /* ---------- CONFETI ---------- */
  .confetti-layer{
    position: fixed; inset:0; pointer-events:none; z-index: 9999; overflow:hidden;
  }
  .confetti-piece{
    position:absolute; top:-12px; width:8px; height:14px; border-radius:2px;
    opacity:0.95;
    animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
  }
  @keyframes confetti-fall{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform: translate(var(--drift), var(--fall)) rotate(var(--rot)); opacity:0; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1>✏️ Dictado</h1>
    <div class="hero-row" id="hero-row">
      <span class="stat-pill" id="stat-streak">
        <span class="stat-icon">🔥</span>
        <span class="stat-value" id="stat-streak-value">0</span>
      </span>
      <div class="pet-hero" id="pet-hero">
        <div class="pet-emoji-wrap">
          <span class="pet-hero-emoji" id="pet-hero-emoji">🐱</span>
          <span class="pet-accessory" id="pet-accessory"></span>
        </div>
        <span class="pet-hero-name" id="pet-hero-name">Gatito</span>
      </div>
      <span class="stat-pill" id="stat-coins">
        <span class="stat-icon">💰</span>
        <span class="stat-value" id="stat-coins-value">0</span>
      </span>
    </div>
  </header>

  <div class="speed-control" id="speed-control" role="group" aria-label="Velocidad de dictado">
    <span class="speed-label">🔊</span>
    <button type="button" class="speed-btn" data-rate="0.6" aria-pressed="false" onclick="setRate(0.6,this)">🐢 Lenta</button>
    <button type="button" class="speed-btn active" data-rate="0.8" aria-pressed="true" onclick="setRate(0.8,this)">🚶 Normal</button>
    <button type="button" class="speed-btn" data-rate="1.05" aria-pressed="false" onclick="setRate(1.05,this)">🐇 Rápida</button>
  </div>

  <div class="card">

    <!-- MENU -->
    <section id="screen-menu" class="screen">

function todayKey(){

}
function daysBetween(dateStrA, dateStrB){
  const a = new Date(dateStrA + "T00:00:00");
  const b = new Date(dateStrB + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function registerActivity(){

function burstConfetti(big){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const count = big ? 60 : 16;
  const colors = ["#6C5CE7","#FF6F91","#FFC371","#22C55E","#3A86FF","#FF2D95"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  document.body.appendChild(layer);
  for(let i = 0; i < count; i++){
    const el = document.createElement("span");
    el.className = "confetti-piece";
    el.style.left = (50 + (Math.random()*46 - 23)) + "vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.setProperty("--rot", (Math.random()*360) + "deg");
    el.style.setProperty("--drift", (Math.random()*140 - 70) + "px");
    el.style.setProperty("--fall", (big ? 420 + Math.random()*180 : 240 + Math.random()*90) + "px");
    el.style.animationDuration = (big ? 1.3 + Math.random()*0.6 : 0.8 + Math.random()*0.35) + "s";
    el.style.animationDelay = (Math.random()*0.15) + "s";
    layer.appendChild(el);
  }
  setTimeout(() => layer.remove(), big ? 2200 : 1400);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const num = parseInt(h,16);
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ---------------- Speech ---------------- */
const VOICE_ORDER = [
  "es-mx","es-us","es-419","es-ar","es-co","es-cl","es-pe","es-bo","es-uy",
  "es-py","es-ve","es-ec","es-cr","es-pa","es-do","es-gt","es-hn","es-ni",
  "es-sv","es-pr","es-es"
];
let spanishVoice = null;
let voiceChecked = false;

function voiceRank(v){
  const lang = (v.lang || "").toLowerCase().replace("_","-");
  const idx = VOICE_ORDER.indexOf(lang);
  if(idx !== -1) return idx;
  if(lang.startsWith("es")) return VOICE_ORDER.indexOf("es-es") - 0.5;
  return 999;
}
function pickVoice(){
  if(!("speechSynthesis" in window)) { showVoiceWarning("nospeech"); return; }
  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return;
  const es = voices.filter(v => (v.lang || "").toLowerCase().startsWith("es"));
  if(es.length === 0){ spanishVoice = null; showVoiceWarning("noes"); voiceChecked = true; return; }
  es.sort((a,b) => voiceRank(a) - voiceRank(b));
  spanishVoice = es[0];
  voiceChecked = true;
  const lang = (spanishVoice.lang || "").toLowerCase().replace("_","-");
  showVoiceWarning(lang === "es-es" ? "peninsular" : "ok");
}
function showVoiceWarning(kind){
  const el = document.getElementById("voice-warn");
  if(!el) return;
  if(kind === "ok"){ el.classList.add("hidden"); el.innerHTML = ""; return; }
  let html = "";
  if(kind === "nospeech"){
    html = "<strong>Este navegador no puede dictar.</strong>Abrí el archivo en Chrome, Edge o Safari.";
  } else if(kind === "noes"){
    html = "<strong>No hay voz en español instalada.</strong>Las palabras se van a leer con voz de otro idioma y el dictado no sirve. Instalá una voz en español desde la configuración del sistema (Windows: Configuración → Hora e idioma → Voz; macOS: Accesibilidad → Contenido hablado; Android: Ajustes → Sistema → Idiomas → Salida de texto a voz).";
  } else if(kind === "peninsular"){
    html = "<strong>Solo hay voz de España.</strong>Pronuncia la C y la Z distinto, así que las palabras de la categoría C · S · Z se resuelven de oído. Conviene instalar una voz latinoamericana (México, Argentina, Colombia, etc.).";
  }
  el.innerHTML = html;
  el.classList.remove("hidden");
}
if("speechSynthesis" in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
  setTimeout(() => { if(!voiceChecked) pickVoice(); }, 1200);
} else {
  showVoiceWarning("nospeech");
}

function speechTextFor(item){
  if(item.frase) return item.w + ". Como en: " + item.frase + " " + item.w + ".";
  return item.w + ".";
}
function speak(text, onend){
  if(!("speechSynthesis" in window)){ if(onend) onend(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = spanishVoice ? spanishVoice.lang : "es-MX";
  u.rate = currentRate;
  if(spanishVoice) u.voice = spanishVoice;
  let done = false;
  const finish = () => { if(!done){ done = true; if(onend) onend(); } };
  u.onend = finish;
  u.onerror = finish;
  window.speechSynthesis.speak(u);
  setTimeout(finish, Math.max(2800, text.length * 280 / currentRate));
}

function replayCurrent(){
  if(!state.current) return;
  const item = state.current;
  if(state.phase === "revealed"){ speak(speechTextFor(item)); return; }
  clearPending();
  state.phase = "dictating";
  state.timerPaused = false;
  renderCurrent();
  const token = ++state.speakToken;
  speak(speechTextFor(item), () => {
    if(token !== state.speakToken) return;
    if(state.current !== item) return;
    beginWaiting();
  });
}

/* ---------------- Screen switching ---------------- */
function showScreen(name){

  });

function exitToMenu(){

    if(!confirm("Vas a perder el avance de este examen. ¿Salir igual?")) return;
  }
  if(state.screen === "practice" && (state.practiceCorrect > 0 || state.practiceWrong.length > 0)){
    // guardar errores de la sesión de práctica
    if(state.practiceWrong.length){
      state.lastWrong = state.practiceWrong.map(x => x.w);
      savePrefs();
    }
  }
  clearPending();
  state.speakToken++;
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  state.current = null;
  state.phase = null;
  state.timerPaused = false;
  showScreen("menu");

/* ---------------- Timer (JS, pausable) ---------------- */
function runCountdown(fillEl, seconds, cb){
  clearPending();
  state.timerRemaining = seconds;
  state.timerPaused = false;
  state.timerEndAt = performance.now() + seconds * 1000;
  fillEl.classList.remove("paused");
  fillEl.style.width = "100%";

  const tick = (now) => {
    if(state.timerPaused){
      state.timerRaf = requestAnimationFrame(tick);
      return;
    }
    const left = Math.max(0, (state.timerEndAt - now) / 1000);
    state.timerRemaining = left;
    fillEl.style.width = (left / seconds * 100) + "%";
    if(left <= 0){
      state.timerRaf = null;
      cb();
      return;
    }
    state.timerRaf = requestAnimationFrame(tick);
  };
  state.timerRaf = requestAnimationFrame(tick);
}

function pauseTimer(){
  if(state.phase !== "waiting" || state.timerPaused) return;
  state.timerPaused = true;
  state.timerRemaining = Math.max(0, (state.timerEndAt - performance.now()) / 1000);
  const fill = document.getElementById(state.screen + "-timerfill");
  if(fill) fill.classList.add("paused");
  const btn = document.getElementById("btn-pause");
  if(btn) btn.textContent = "▶️ Seguir";
  renderCurrent();
}
function resumeTimer(){
  if(state.phase !== "waiting" || !state.timerPaused) return;
  state.timerPaused = false;
  state.timerEndAt = performance.now() + state.timerRemaining * 1000;
  const fill = document.getElementById(state.screen + "-timerfill");
  if(fill) fill.classList.remove("paused");
  const btn = document.getElementById("btn-pause");
  if(btn) btn.textContent = "⏸️ Pausar";
}
function togglePause(){
  if(state.timerPaused) resumeTimer();
  else pauseTimer();
}
function addTime(sec){
  if(state.phase !== "waiting") return;
  state.timerRemaining += sec;
  state.timerEndAt += sec * 1000;
  const fill = document.getElementById(state.screen + "-timerfill");
  if(fill && !state.timerPaused){
    // width se actualiza en el próximo tick
  }
}

/* ---------------- Shared render helpers ---------------- */

function renderCurrent(){
  if(state.screen === "practice") renderPractice();
  else if(state.screen === "exam") renderExam();
}
function beginWaiting(){
  state.phase = "waiting";
  state.timerPaused = false;
  renderCurrent();
  if(state.typeMode){
    // En modo escritura en pantalla no corre timer: se corrige recién al enviar.
    clearPending();
  } else {
    const fill = document.getElementById(state.screen + "-timerfill");
    const secs = writeSeconds(state.current);
    runCountdown(fill, secs, () => {
      state.phase = "revealed";
      maybeAutoCheck();
      renderCurrent();
    });
  }
  // foco al input si hay escritura en pantalla
  if(state.typeMode){
    setTimeout(() => {
      const inp = document.getElementById("type-input");
      if(inp) inp.focus();
    }, 50);

function syncTimerbarVisibility(){

}
// Envío en modo escritura: sin timer, corrige apenas se envía (Enter o botón).
// Corrige solo, pero espera a que toquen "Siguiente" / Enter / la tarjeta
// para pasar de palabra — así da tiempo a leer la regla.
function submitTyped(){
  if(state.phase !== "waiting" || !state.typeMode) return;
  clearPending();
  stopTimerBar();
  maybeAutoCheck();
  if(state._lastMatch) rewardCorrect();
  state.phase = "revealed";
  renderCurrent();
}
function avanzarTyped(){
  if(state.phase !== "revealed" || !state.typeMode) return;
  clearPending();
  const ok = state._lastMatch;
  if(state.screen === "practice") markPractice(ok, true);
  else if(state.screen === "exam") markExam(ok, true);
}
function stopTimerBar(){

  fill.classList.remove("paused");

}
function revealNow(ev){

function setStageClickable(stage, on, handler){
  stage.classList.toggle("clickable", !!on);
  stage.onclick = on ? function(e){
    if(e && e.target && e.target.closest && e.target.closest("button, input")) return;
    handler();
  } : null;
  if(on){ stage.setAttribute("role","button"); stage.setAttribute("tabindex","0"); }
  else { stage.removeAttribute("role"); stage.removeAttribute("tabindex"); }
}

function maybeAutoCheck(){
  if(!state.typeMode || !state.current) return;
  const inp = document.getElementById("type-input");
  if(!inp) return;
  const typed = normalizeAnswer(inp.value);
  const target = normalizeAnswer(state.current.w);
  // se evalúa al revelar; el feedback se pinta en render
  state._lastTyped = typed;
  state._lastMatch = typed.length > 0 && typed === target;
}

function typeFeedbackHTML(){
  if(!state.typeMode) return "";
  if(state.phase !== "revealed") return "";
  const typed = state._lastTyped || "";
  if(!typed){
    return `<div class="type-feedback">No escribiste nada en pantalla.</div>`;
  }
  if(state._lastMatch){
    return `<div class="type-feedback ok">✓ Escribiste bien: «${typed}»</div>`;
  }
  return `<div class="type-feedback ko">✗ Escribiste «${typed}» · correcto: «${state.current.w}»</div>`;
}

/* ---------------- Filtro de categorias ---------------- */
function activeWords(){
  return WORDS.filter(w => selectedCats.has(w.cat));
}
function buildChips(){
  const el = document.getElementById("cat-chips");
  el.innerHTML = Object.entries(CAT).map(([key, c]) => {
    const n = WORDS.filter(w => w.cat === key).length;
    return `<button type="button" class="cat-chip" id="chip-${key}" aria-pressed="true"
      style="border-color:${c.color}; color:${c.color}"
      onclick="toggleCat('${key}')">${c.label} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
  paintChips();
}
function paintChips(){
  Object.entries(CAT).forEach(([key, c]) => {
    const chip = document.getElementById("chip-" + key);
    if(!chip) return;
    const on = selectedCats.has(key);
    chip.setAttribute("aria-pressed", on ? "true" : "false");
    chip.style.background = on ? hexToRgba(c.color, 0.14) : "#fff";
  });
  const total = activeWords().length;
  const countEl = document.getElementById("filter-count");
  const modeBtns = document.querySelectorAll(".mode-btn:not(#btn-review)");
  if(total === 0){
    countEl.textContent = "Elige al menos una regla para empezar.";
    countEl.classList.add("warn");
    modeBtns.forEach(b => { b.disabled = true; });
  } else {
    countEl.textContent = "";
    countEl.classList.remove("warn");
    modeBtns.forEach(b => { b.disabled = false; });
  }
  savePrefs();
}
function toggleCat(key){
  if(selectedCats.has(key)) selectedCats.delete(key); else selectedCats.add(key);
  paintChips();
}
function setAllCats(on){
  selectedCats = on ? new Set(Object.keys(CAT)) : new Set();
  paintChips();
}

function stratifiedSample(n){
  const pools = {};
  activeWords().forEach(w => { (pools[w.cat] = pools[w.cat] || []).push(w); });
  Object.keys(pools).forEach(k => { pools[k] = shuffle(pools[k]); });
  const out = [];
  while(out.length < n){
    const keys = shuffle(Object.keys(pools).filter(k => pools[k].length > 0));
    if(keys.length === 0) break;
    for(const k of keys){
      if(out.length >= n) break;
      out.push(pools[k].pop());
    }
  }
  return shuffle(out);
}

function updateReviewButton(){
  const btn = document.getElementById("btn-review");
  const desc = document.getElementById("review-desc");
  const n = state.lastWrong.length;
  if(n > 0){
    btn.classList.remove("hidden");
    desc.textContent = n + " palabra" + (n === 1 ? "" : "s") + " de la última sesión.";
  } else {
    btn.classList.add("hidden");
  }
}

/* ---------------- PRACTICE MODE ---------------- */
function startPractice(){
  if(activeWords().length === 0) return;
  state.mode = "practice";
  state.queue = shuffle(activeWords());
  state.practiceCount = 0;
  state.practiceCorrect = 0;
  state.practiceWrong = [];
  state.sessionCorrectStreak = 0;
  showScreen("practice");
  nextPracticeWord();
}
function startReview(){
  const pool = WORDS.filter(w => state.lastWrong.includes(w.w) && selectedCats.has(w.cat));
  const words = pool.length ? pool : WORDS.filter(w => state.lastWrong.includes(w.w));
  if(words.length === 0){
    alert("No hay errores guardados para repasar.");
    return;
  }
  state.mode = "review";
  state.queue = shuffle(words);
  state.practiceCount = 0;
  state.practiceCorrect = 0;
  state.practiceWrong = [];
  state.sessionCorrectStreak = 0;
  showScreen("practice");
  nextPracticeWord();
}
function nextPracticeWord(){
  clearPending();
  if(state.queue.length === 0){
    // fin de cola: si hay errores de esta sesión, ofrecer resultados
    finishPracticeSession();
    return;
  }
  state.current = state.queue.pop();
  state.practiceCount++;
  state.phase = "dictating";
  state._lastTyped = "";
  state._lastMatch = false;
  renderPractice();
  const token = ++state.speakToken;
  speak(speechTextFor(state.current), () => {
    if(token !== state.speakToken) return;
    if(state.screen !== "practice" || state.current === null) return;
    beginWaiting();
  });
}
/* ---------------- Frases de aliento ---------------- */
const ENCOURAGEMENT = {
  excellent: ["¡Excelente! 🌟 Dominás estas palabras.", "¡Sos una máquina! 🚀 Ortografía impecable.", "¡Perfecto! 🏆 No fallaste casi nada."],
  great:     ["¡Muy bien! 👏 Vas por muy buen camino.", "¡Gran trabajo! 💪 Cada vez mejor.", "¡Así se hace! 🔥 Seguí así."],
  good:      ["Bien, seguí practicando un poco más. 💪", "Vas bien, un poco más y la sacás. 📈", "Buen intento, ya casi lo tenés. 🙂"],
  keep:      ["Sigamos practicando, cada intento suma. 📖", "No te desanimes, la próxima sale mejor. 🌱", "Practicando es como se aprende. ¡De nuevo! 🔁"]
};
function pickEncouragement(tier){
  const arr = ENCOURAGEMENT[tier];
  return arr[Math.floor(Math.random() * arr.length)];
}
function finishPracticeSession(){
  clearPending();
  const totalAnswered = state.practiceCorrect + state.practiceWrong.length;
  if(totalAnswered > 0){
    state.lastWrong = state.practiceWrong.map(x => x.w);
    savePrefs();
  }
  // mostrar resumen estilo results
  state.current = null;
  showScreen("results");
  const total = state.practiceCorrect + state.practiceWrong.length;
  const score = total ? Math.round(state.practiceCorrect / total * 100) : 0;
  if(total > 0){
    registerActivity();
    if(score >= 70) burstConfetti(true);
  }
  document.getElementById("result-score").textContent = score;
  document.getElementById("result-den").textContent = "de 100 (práctica)";
  let msg;
  if(total === 0){ msg = "No marcaste aciertos ni fallos en esta sesión."; }
  else if(score >= 90){ msg = pickEncouragement("excellent"); }
  else if(score >= 70){ msg = pickEncouragement("great"); }
  else if(score >= 51){ msg = pickEncouragement("good"); }
  else { msg = pickEncouragement("keep"); }
  document.getElementById("result-msg").textContent = msg;
  document.getElementById("result-sub").textContent = state.practiceCorrect + " de " + total + " marcadas como correctas";

  const listEl = document.getElementById("result-review-list");
  const titleEl = document.getElementById("result-review-title");
  const reviewBtn = document.getElementById("result-review-btn");
  const againBtn = document.getElementById("result-again");
  listEl.innerHTML = "";
  againBtn.textContent = "📘 Seguir practicando";
  againBtn.onclick = () => startPractice();
  if(state.practiceWrong.length > 0){
    titleEl.classList.remove("hidden");
    titleEl.textContent = "Para repasar:";
    state.practiceWrong.forEach(item => {
      const div = document.createElement("div");
      div.className = "review-item";
      div.innerHTML = `<strong>${item.w}</strong><p>${item.rule}</p>`;
      listEl.appendChild(div);
    });
    reviewBtn.classList.remove("hidden");
    reviewBtn.onclick = () => startReview();
  } else {
    titleEl.classList.add("hidden");
    reviewBtn.classList.add("hidden");
  }
  updateReviewButton();
}
function markPractice(correct, alreadyRewarded){
  if(state.phase !== "revealed") return;
  if(correct){
    state.practiceCorrect++;
    state.sessionCorrectStreak++;
    checkAchievements();
    if(!alreadyRewarded){
      rewardCorrect();
      setTimeout(nextPracticeWord, 700);
      return;
    }
  } else {
    state.practiceWrong.push(state.current);
    state.sessionCorrectStreak = 0;
  }
  nextPracticeWord();
}
function renderPractice(){
  document.getElementById("practice-badge").innerHTML = badgeHTML(state.current);
  const label = state.mode === "review" ? "Repaso" : "Palabra";
  document.getElementById("practice-counter").textContent = label + " " + state.practiceCount;
  const stats = document.getElementById("practice-stats");
  stats.innerHTML = `<span class="ok">✓ ${state.practiceCorrect}</span> · <span class="ko">✗ ${state.practiceWrong.length}</span>`;

  const status = document.getElementById("practice-status");
  const stage = document.getElementById("practice-stage");
  setStageClickable(stage, false, null);
  syncTimerbarVisibility();
  if(state.phase === "dictating"){
    status.textContent = "🔊 Dictando...";
    stage.innerHTML = `<div class="speaker-icon">🔊</div>`;
  } else if(state.phase === "waiting"){
    status.textContent = state.typeMode ? "✍️ Escribí la palabra abajo..." : "✍️ Escribí la palabra en tu hoja...";
    stage.innerHTML = stageWaitingHTML(state.current);
  } else if(state.phase === "revealed" && state.typeMode){
    status.textContent = state._lastMatch ? "¡Bien! 🎉" : "Fijate la regla 👇";
    stage.innerHTML = revealBlockHTML(state.current) + typeFeedbackHTML() + `
      <div class="controls-row" style="margin-top:18px;">
        <button type="button" class="btn-ghost" onclick="avanzarTyped()">➡️ Siguiente</button>
      </div>
      <div class="hint-text">Ya se corrigió solo · <kbd>Enter</kbd>, tocá o el botón para seguir</div>`;
    setStageClickable(stage, true, avanzarTyped);
  } else if(state.phase === "revealed"){
    status.textContent = "¿La escribiste correctamente?";
    stage.innerHTML = revealBlockHTML(state.current) + typeFeedbackHTML() + `
      <div class="controls-row" style="margin-top:18px;">
        <button type="button" class="btn-good" onclick="markPractice(true)">✅ Correcta</button>
        <button type="button" class="btn-bad" onclick="markPractice(false)">❌ Incorrecta</button>
      </div>
      <div class="hint-text">Teclas: <kbd>1</kbd> correcta · <kbd>2</kbd> incorrecta</div>`;

      listEl.appendChild(div);
    });
    reviewBtn.classList.remove("hidden");
    reviewBtn.onclick = () => startReview();
  } else {
    titleEl.classList.add("hidden");
    reviewBtn.classList.add("hidden");
  }
  updateReviewButton();
}

/* ---------------- Init ---------------- */
loadPrefs();
loadProgress();
buildChips();
buildPetChips();
buildAccessoryChips();
buildAchievementChips();
applyLoadedPrefs();
updateProgressUI();
updateChestUI();
["practice-stage","exam-stage"].forEach(id => {
  document.getElementById(id).setAttribute("aria-live","polite");
});

/* Pausar síntesis al ocultar pestaña */
document.addEventListener("visibilitychange", () => {
  if(document.hidden && "speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }
});

/* ---------------- Teclado ---------------- */
const IGNORED_KEYS = ["Shift","Control","Alt","Meta","Tab","CapsLock","Escape","AltGraph","ContextMenu"];
document.addEventListener("keydown", (e) => {
  if(IGNORED_KEYS.indexOf(e.key) !== -1) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;

  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");

  // Espacio = replay (si no estamos escribiendo)
  if(e.key === " " && !typing && (state.screen === "practice" || state.screen === "exam")){
    e.preventDefault();
    replayCurrent();
    return;
  }

  // + = sumar tiempo
  if((e.key === "+" || e.key === "=") && state.phase === "waiting"){
    e.preventDefault();
    addTime(5);
    return;
  }

  // Enter en waiting = revelar (modo no-escritura; en modo escritura el input maneja su propio Enter)
  if(e.key === "Enter" && state.phase === "waiting" && !typing && !state.typeMode){
    e.preventDefault();
    revealNow(e);
    return;
  }

  // Enter en la pantalla de auto-corrección (modo escritura) = pasar a la próxima ya
  if(e.key === "Enter" && state.phase === "revealed" && state.typeMode && !typing){
    e.preventDefault();
    avanzarTyped();
    return;
  }

  // 1 / 2 en revealed — solo en modo no-escritura (en modo escritura ya se corrige solo)
  if(state.phase === "revealed" && !state.typeMode){
    if(e.key === "1"){
      e.preventDefault();
      if(state.screen === "practice") markPractice(true);
      else if(state.screen === "exam") markExam(true);
      return;
    }
    if(e.key === "2"){
      e.preventDefault();
      if(state.screen === "practice") markPractice(false);
      else if(state.screen === "exam") markExam(false);
      return;
    }
  }

  if(ae && ae.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;

  // cualquier tecla en práctica revealed (sin input) ya no avanza sola: hay que marcar
});

/* ---------------- PWA: registro del service worker ---------------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => {
      console.warn("No se pudo registrar el service worker:", err);
    });
  });
}
